<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>College Materials</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #111111;
    display: flex;
    min-height: 100vh;
}

/* ================================
   SIDEBAR
   ================================ */

.sidebar {
    width: 280px;
    min-height: 100vh;
    background: #eeeeee;
    padding: 30px 20px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

.sidebar h2 {
    margin-top: 0;
    margin-bottom: 25px;
}

.course-button {
    display: block;
    width: 100%;
    padding: 14px 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.course-button:hover {
    background: #dddddd;
}

/* ================================
   MAIN CONTENT
   ================================ */

.content {
    margin-left: 280px;
    padding: 40px;
    width: calc(100% - 280px);
    max-width: 1500px;
}

#courseTitle {
    font-size: 32px;
    margin-top: 0;
    margin-bottom: 35px;
}

/* ================================
   SECTIONS
   ================================ */

.section {
    margin-bottom: 45px;
}

.section h2 {
    font-size: 28px;
    margin-bottom: 18px;
}

/* ================================
   PDF ITEMS
   ================================ */

.pdf {
    padding: 18px 22px;
    margin: 10px 0;
    border: 1px solid #dddddd;
    border-radius: 10px;
    background: #ffffff;
    transition: background 0.15s;
}

.pdf:hover {
    background: #f7f7f7;
}

.pdf a {
    color: #0000ee;
    text-decoration: none;
    font-size: 17px;
}

.pdf a:hover {
    text-decoration: underline;
}

.empty {
    color: #777777;
    font-size: 16px;
}

/* ================================
   MOBILE
   ================================ */

@media (max-width: 700px) {

    .sidebar {
        width: 210px;
    }

    .content {
        margin-left: 210px;
        width: calc(100% - 210px);
        padding: 25px;
    }

}

</style>

</head>

<body>

<div class="sidebar">

<h2>📚 My Courses</h2>


<button
    class="course-button"
    onclick="showCourse('MA101')">

    MA101

</button>

<button
    class="course-button"
    onclick="showCourse('PHY101/ODD 2026-27')">

    PHY101/ODD 2026-27

</button>

<button
    class="course-button"
    onclick="showCourse('CSO-101 Computer Programming')">

    CSO-101 Computer Programming

</button>


</div>

<div class="content">

<h1 id="courseTitle">
College Materials
</h1>

<div id="courseContent">

<p>
Select a course from the sidebar.
</p>

</div>

</div>

<script>

const courses = {


    'MA101': {
        folder: 'MA101',

        lectures: [

        ],

        tutorials: [

        ],

        assignments: [

        ]
    },


    'PHY101/ODD 2026-27': {
        folder: 'PHY101-ODD-2026-27',

        lectures: [
            'Cartesian and Cylindrical Coordinate system 1.pdf',
            'Cartesian and Cylindrical Coordinate systems 2.pdf',
            'Constraints  and Virtual work.pdf',
            'Constraints 1.pdf',
            'Constraints image.png.pdf',
            'file.pdf',
            'Gradient divergence and curl.pdf',
            'L2 Spherical Coordinate systems 1.pdf',
            'L2 Spherical Coordinate systems 2.pdf',
            'Lecture 1-Coordinate_Systems.pdf',
            'Lecture 2-Coordinate_Systems.pdf',
            'Lecture 3-Coordinate_Systems.pdf',
            'Lecture 4-Single_Particle_Mechanics.pdf',
            'Lecture 5-Many_Particle_Mechanics.pdf',
            'Lecture 6-Constrains_Degree_of_Freedom.pdf',
            'Lecture 7-Generalized_Coordinates_Velocity.pdf',
            'Mechanics of particle systems.pdf',
            'Partial Derivatives.pdf',

        ],

        tutorials: [

        ],

        assignments: [

        ]
    },


    'CSO-101 Computer Programming': {
        folder: 'CSO-101',

        lectures: [
            'CS101-Lec1-2 Introduction to Computers.pdf',
            'CS101-Lec4-5 Introduction to C.pdf',
            'CS101-Lec6,7 C Fundamentals-Part 1.pdf',
            'CSO 101 Computer Programming Syllabus (Odd Sem 2026).pdf',
            'CSO101-Lectures1,2,3 Introduction to Computing.pdf',

        ],

        tutorials: [

        ],

        assignments: [

        ]
    },



};


/* ==========================================
   CREATE PDF SECTION
   ========================================== */

function createSection(
    title,
    icon,
    files,
    folder
) {

    let section = "";

    section +=
        '<div class="section">';

    section +=
        '<h2>' +
        icon +
        ' ' +
        title +
        '</h2>';

    if (
        !files ||
        files.length === 0
    ) {

        section +=
            '<p class="empty">' +
            'Nothing available yet.' +
            '</p>';

    } else {

        files.forEach(
            function(filename) {

                const encodedFilename =
                    encodeURIComponent(
                        filename
                    );

                section +=
                    '<div class="pdf">' +
                    '📄 ' +
                    '<a href="pdfs/' +
                    folder +
                    '/' +
                    encodedFilename +
                    '" target="_blank">' +
                    escapeHtml(filename) +
                    '</a>' +
                    '</div>';

            }
        );
    }

    section += '</div>';

    return section;
}


/* ==========================================
   ESCAPE HTML
   ========================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/* ==========================================
   SHOW COURSE
   ========================================== */

function showCourse(courseName) {

    const course =
        courses[courseName];

    if (!course) {

        return;
    }

    document.getElementById(
        "courseTitle"
    ).textContent = courseName;

    const content =
        document.getElementById(
            "courseContent"
        );

    content.innerHTML =

        createSection(
            "Lectures",
            "📚",
            course.lectures,
            course.folder
        )

        +

        createSection(
            "Tutorial Sheets",
            "📝",
            course.tutorials,
            course.folder
        )

        +

        createSection(
            "Assignments",
            "📋",
            course.assignments,
            course.folder
        );
}

</script>

</body>

</html>
