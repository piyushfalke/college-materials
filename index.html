<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>College Materials</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    min-height: 100vh;
    background: #f7f7f7;
}

.sidebar {
    width: 280px;
    background: #eeeeee;
    padding: 20px;
}

.sidebar h2 {
    margin-top: 0;
}

.course-button {
    display: block;
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 7px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.course-button:hover {
    background: #dddddd;
}

.content {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
}

.section {
    margin-top: 28px;
}

.section h2 {
    margin-bottom: 12px;
}

.pdf {
    padding: 15px;
    margin: 10px 0;
    background: white;
    border: 1px solid #dddddd;
    border-radius: 8px;
}

.pdf a {
    text-decoration: none;
}

.pdf a:hover {
    text-decoration: underline;
}

.empty {
    color: #777777;
    padding: 8px 0;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>📚 My Courses</h2>

<button
    class="course-button"
    onclick="showCourse('MA101')">

    MA101

</button>

<button
    class="course-button"
    onclick="showCourse('PHY101/ODD 2026-27')">

    PHY101/ODD 2026-27

</button>

<button
    class="course-button"
    onclick="showCourse('CSO-101 Computer Programming')">

    CSO-101 Computer Programming

</button>


</div>

<div class="content">

<h1 id="courseTitle">
    College Materials
</h1>

<p id="courseDescription">
    Select a course from the sidebar.
</p>

<div id="courseContent"></div>

</div>

<script>

const courses = {

    'MA101': {
        folder: 'MA101',
        materials: [

        ],
        tutorials: [

        ],
        assignments: [

        ]
    },

    'PHY101/ODD 2026-27': {
        folder: 'PHY101-ODD-2026-27',
        materials: [
            {filename: 'Lecture 3-Coordinate_Systems.pdf', title: "Week 2 - L3: Newton's equation in Various Coordinate systems"},

        ],
        tutorials: [

        ],
        assignments: [
            {filename: 'L2 Spherical Coordinate systems 1.pdf', title: 'Week 2-L2: Spherical polar coordinates'},
            {filename: 'L2 Spherical Coordinate systems 2.pdf', title: 'Week 2-L2: Spherical polar coordinates'},
            {filename: 'Lecture 2-Coordinate_Systems.pdf', title: 'Week 2-L2: Spherical polar coordinates'},
            {filename: 'Cartesian and Cylindrical Coordinate system 1.pdf', title: 'Week 1-L1: Cartesian and Cylindrical Coordinate System'},
            {filename: 'Cartesian and Cylindrical Coordinate systems 2.pdf', title: 'Week 1-L1: Cartesian and Cylindrical Coordinate System'},
            {filename: 'Lecture 1-Coordinate_Systems.pdf', title: 'Week 1-L1: Cartesian and Cylindrical Coordinate System'},

        ]
    },

    'CSO-101 Computer Programming': {
        folder: 'CSO-101',
        materials: [
            {filename: 'CSO101-Lectures1,2,3 Introduction to Computing.pdf', title: 'CSO101-Lectures 1,2,3 (Introduction to Computing)'},
            {filename: 'CS101-Lec1-2 Introduction to Computers.pdf', title: 'CSO101-Lec1-2 Slides'},
            {filename: 'CSO 101 Computer Programming Syllabus (Odd Sem 2026).pdf', title: 'CSO101-Computer Programming Syllabus'},

        ],
        tutorials: [

        ],
        assignments: [

        ]
    },



};


function createSection(
    course,
    title,
    icon,
    items
) {

    const section =
        document.createElement("div");

    section.className = "section";

    const heading =
        document.createElement("h2");

    heading.textContent =
        icon + " " + title;

    section.appendChild(heading);

    if (items.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Nothing available yet.";

        section.appendChild(empty);

        return section;
    }

    items.forEach(function(item) {

        const div =
            document.createElement("div");

        div.className = "pdf";

        const encodedFilename =
            encodeURIComponent(
                item.filename
            );

        const link =
            document.createElement("a");

        link.href =
            "pdfs/" +
            course.folder +
            "/" +
            encodedFilename;

        link.target = "_blank";

        link.textContent =
            "📄 " + item.filename;

        div.appendChild(link);

        section.appendChild(div);

    });

    return section;
}


function showCourse(courseName) {

    document.getElementById(
        "courseTitle"
    ).textContent = courseName;

    document.getElementById(
        "courseDescription"
    ).textContent =
        "Course Materials, Tutorial Sheets and Assignments";

    const content =
        document.getElementById(
            "courseContent"
        );

    content.innerHTML = "";

    const course =
        courses[courseName];

    if (!course) {
        return;
    }

    content.appendChild(
        createSection(
            course,
            "Course Materials",
            "📚",
            course.materials
        )
    );

    content.appendChild(
        createSection(
            course,
            "Tutorial Sheets",
            "📝",
            course.tutorials
        )
    );

    content.appendChild(
        createSection(
            course,
            "Assignments",
            "📋",
            course.assignments
        )
    );

}

</script>

</body>

</html>
