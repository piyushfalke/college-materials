<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>College Materials</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    min-height: 100vh;
    background: #ffffff;
}

.sidebar {
    width: 280px;
    background: #eeeeee;
    padding: 30px 20px;
    min-height: 100vh;
}

.sidebar h2 {
    margin-top: 0;
    margin-bottom: 25px;
}

.course-button {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    background: transparent;
}

.course-button:hover {
    background: #dddddd;
}

.content {
    flex: 1;
    padding: 40px;
    max-width: 1400px;
}

.section {
    margin-bottom: 45px;
}

.section h2 {
    font-size: 28px;
    margin-bottom: 15px;
}

.pdf {
    padding: 18px;
    margin: 10px 0;
    border: 1px solid #dddddd;
    border-radius: 10px;
    background: white;
}

.pdf:hover {
    background: #f8f8f8;
}

.pdf a {
    text-decoration: none;
    color: #0000ee;
    font-size: 17px;
}

.pdf a:hover {
    text-decoration: underline;
}

.empty {
    color: #777777;
    font-size: 16px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>📚 My Courses</h2>

<button
    class="course-button"
    onclick="showCourse('MA101')">

    MA101

</button>

<button
    class="course-button"
    onclick="showCourse('PHY101/ODD 2026-27')">

    PHY101/ODD 2026-27

</button>

<button
    class="course-button"
    onclick="showCourse('CSO-101 Computer Programming')">

    CSO-101 Computer Programming

</button>


</div>

<div class="content">

<h1 id="courseTitle">
College Materials
</h1>

<div id="courseContent">

<p>Select a course from the sidebar.</p>

</div>

</div>

<script>

const courses = {


    'MA101': {
        folder: 'MA101',
        lectures: [

        ],
        tutorials: [

        ],
        assignments: [

        ]
    },

    'PHY101/ODD 2026-27': {
        folder: 'PHY101-ODD-2026-27',
        lectures: [

            'Lecture 1-Coordinate_Systems.pdf',

            'Lecture 2-Coordinate_Systems.pdf',

            'Lecture 3-Coordinate_Systems.pdf',

        ],
        tutorials: [

        ],
        assignments: [

            'Cartesian and Cylindrical Coordinate system 1.pdf',

            'Cartesian and Cylindrical Coordinate systems 2.pdf',

            'L2 Spherical Coordinate systems 1.pdf',

            'L2 Spherical Coordinate systems 2.pdf',

            'file.pdf',

        ]
    },

    'CSO-101 Computer Programming': {
        folder: 'CSO-101',
        lectures: [

            'CS101-Lec1-2 Introduction to Computers.pdf',

            'CSO 101 Computer Programming Syllabus (Odd Sem 2026).pdf',

            'CSO101-Lectures1,2,3 Introduction to Computing.pdf',

        ],
        tutorials: [

        ],
        assignments: [

        ]
    },


};


function createSection(
    title,
    icon,
    files,
    folder
) {

    let html = "";

    html += '<div class="section">';

    html +=
        '<h2>' +
        icon +
        ' ' +
        title +
        '</h2>';

    if (
        !files ||
        files.length === 0
    ) {

        html +=
            '<p class="empty">' +
            'Nothing available yet.' +
            '</p>';

    } else {

        files.forEach(
            function(filename) {

                const encodedFilename =
                    encodeURIComponent(
                        filename
                    );

                html +=
                    '<div class="pdf">' +
                    '📄 ' +
                    '<a href="pdfs/' +
                    folder +
                    '/' +
                    encodedFilename +
                    '" target="_blank">' +
                    filename +
                    '</a>' +
                    '</div>';

            }
        );

    }

    html += '</div>';

    return html;
}


function showCourse(courseName) {

    document.getElementById(
        "courseTitle"
    ).textContent = courseName;

    const course =
        courses[courseName];

    const content =
        document.getElementById(
            "courseContent"
        );

    content.innerHTML =

        createSection(
            "Lectures",
            "📚",
            course.lectures,
            course.folder
        )

        +

        createSection(
            "Tutorial Sheets",
            "📝",
            course.tutorials,
            course.folder
        )

        +

        createSection(
            "Assignments",
            "📋",
            course.assignments,
            course.folder
        );
}

</script>

</body>

</html>
